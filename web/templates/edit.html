{% extends "layout.html" %}
{% block content %}

<div class="container d-flex justify-content-center align-items-center my-5">
  <div class="col-md-8 bg-white p-4 rounded shadow">

   

    <div id="editFormSection">
      <h2 class="text-danger text-center mb-4">Edit Upload</h2>

      <form method="POST">
        <!-- Name -->
        <div class="mb-3">
          <label class="form-label text-danger">Name</label>
          <input type="text" class="form-control" name="name" id="fileNameField" value="{{ file[0] }}" required>
        </div>

        <!-- Description -->
        <div class="mb-3">
          <label class="form-label text-danger">Description</label>
          <textarea class="form-control" name="description" rows="3" required>{{ file[1] }}</textarea>
        </div>

        <!-- Accessibility -->
        <div class="mb-3">
          <label class="form-label text-danger">Accessibility</label><br>
          {% for option in ['Open Access', 'University Only', 'Restricted'] %}
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="visibility" value="{{ option }}"
              {% if file[2] == option %}checked{% endif %}>
            <label class="form-check-label">{{ option }}</label>
          </div>
          {% endfor %}
        </div>

        <!-- Material Type -->
        <div class="mb-3">
          <label class="form-label text-danger">Material Type</label>
          <select name="material_type" id="material_type" class="form-select" onchange="updateFormFields()" required>
            {% for type in material_types %}
            <option value="{{ type[0] }}" {% if type[0] == file_cat_id %}selected{% endif %}>{{ type[1] }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-3">
          <label for="subject_category" class="form-label text-danger">Subject Category</label>
          <select name="subject_category" id="subject_category" class="form-select" required>
            <option value="Humanities">Humanities</option>
            <option value="Theatre">Theatre</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Law">Law</option>
            <option value="Music">Music</option>
            <option value="Physics">Physics</option>
            <option value="Chemistry">Chemistry</option>
            <option value="Biology">Biology</option>
            <option value="Psychology">Psychology</option>
            <option value="Sociology">Sociology</option>
            <option value="Theology">Theology</option>
          </select>
        </div>

        <!-- Dynamic Attributes -->
        <div id="attribute_fields" class="mb-3"></div>

        <!-- Submit -->
        <div class="d-grid">
          <button type="submit" class="btn btn-danger">Save Changes</button>
        </div>
      </form>

      <!-- Back Button -->
      <div class="text-center mt-4">
        <a href="{{ url_for('my_uploads') }}" class="btn btn-outline-danger btn-lg rounded-pill px-4">
          ⬅ Back to My Uploads
        </a>
      </div>
    </div>
  </div>
</div>

<!-- JavaScript -->
<script>
  const attributeData = {{ attribute_map | tojson }};

  function updateFormFields() {
    const selectedId = document.getElementById("material_type").value;
    const container = document.getElementById("attribute_fields");
    container.innerHTML = "";

    if (attributeData[selectedId]) {
      attributeData[selectedId].forEach(attr => {
        const input = document.createElement("input");
        input.type = attr.type || "text";
        input.className = "form-control";
        input.name = attr.name;
        input.id = attr.name;
        input.value = attr.value || "";

        const label = document.createElement("label");
        label.className = "form-label text-danger mt-3";
        label.htmlFor = attr.name;
        label.innerText = attr.name;

        const wrapper = document.createElement("div");
        wrapper.className = "mb-3";
        wrapper.appendChild(label);
        wrapper.appendChild(input);

        container.appendChild(wrapper);
      });
    }
  }

  window.onload = updateFormFields;
</script>

{% endblock %}
