{% extends "layout.html" %}
{% block content %}

    <div class="bg-white p-5 rounded-4 shadow-lg" style="max-width: 600px;">
      <img src="{{ url_for('static', filename='images/access-granted.jpg') }}" alt="Access Granted" width="80" class="mb-3">

      <p class="text-muted lead">
        You have been successfully authenticated and your access request has been approved.
      </p>
      <a href="{{ url_for('index') }}" class="btn btn-danger mt-4 px-4 py-2">Return to Home</a>
