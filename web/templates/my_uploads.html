<h2 class="text-danger mt-4">My Uploaded Materials</h2>
<div class="table-responsive">
  <table class="table table-bordered">
    <thead class="table-danger">
      <tr>
        <th>Name</th>
        <th>Category</th>
        <th>Visibility</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for file in uploads %}
      <tr>
        <td>{{ file[0] }}</td>
        <td>{{ file[-1] }}</td> <!-- assuming last index is category_name -->
        <td>{{ file[6] }}</td>
        <td>
          <a href="{{ url_for('edit_upload', file_id=file[7]) }}" class="btn btn-sm btn-outline-danger">Edit</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
