{% extends "layout.html" %}
{% block content %}

<section class="vh-100 d-flex align-items-center justify-content-center" style="background: url('{{ url_for('static', filename='images/library-bg.jpg') }}') center / cover no-repeat;">
  <div class="container text-center bg-white bg-opacity-75 p-5 rounded-4 shadow">

    <h1 class="display-4 text-danger fw-bold mb-3"> Access Denied</h1>
    <p class="text-muted fs-5 mb-4">
      The email or password you entered is incorrect. Please try again.
    </p>

    <hr class="my-4" style="border-top: 2px solid #c00000; width: 60%; margin: auto;">

    <p class="mt-4">If you believe this is an error, please contact support.</p>

    <a href="{{ url_for('login') }}" class="btn btn-outline-danger btn-lg rounded-pill mt-3 px-4">
       Back to Login
    </a>

  </div>
</section>

{% endblock %}
