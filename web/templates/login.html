{% extends "layout.html" %}
{% block content %}

<section class="py-5 bg-light">
  <div class="container">
    <h2 class="text-center text-danger fw-bold mb-4" data-aos="fade-down">Login & Sign-Up</h2>
    <div class="row justify-content-center g-4">

      <!-- Login Card -->
      <div class="col-md-5" data-aos="fade-right">
        <div class="card shadow-sm p-4 border-0">
          <h4 class="text-danger mb-3">Login</h4>
          <form method="POST">
            <div class="mb-3">
              <label for="loginemail" class="form-label text-muted">Email</label>
              <input type="email" class="form-control" name="loginemail" required>
            </div>
            <div class="mb-3">
              <label for="loginpassword" class="form-label text-muted">Password</label>
              <input type="password" class="form-control" name="loginpassword" required>
            </div>
            <button type="submit" class="btn btn-danger w-100">Login</button>
          </form>
        </div>
      </div>

      <!-- Sign-Up Card -->
      <div class="col-md-5" data-aos="fade-left">
        <div class="card shadow-sm p-4 border-0">
          <h4 class="text-danger mb-3">Sign Up</h4>
          <form method="POST">
            <div class="mb-3">
              <label for="signupname" class="form-label text-muted">Name</label>
              <input type="text" class="form-control" name="signupname" required>
            </div>
            <div class="mb-3">
              <label for="signupsurname" class="form-label text-muted">Surname</label>
              <input type="text" class="form-control" name="signupsurname" required>
            </div>
            <div class="mb-3">
              <label for="signupemail" class="form-label text-muted">Email</label>
              <input type="email" class="form-control" name="signupemail" required>
            </div>
            <div class="mb-3">
              <label for="signuppassword" class="form-label text-muted">Password</label>
              <input type="password" class="form-control" name="signuppassword" required>
            </div>
            <button type="submit" class="btn btn-outline-danger w-100">Sign Up</button>
          </form>
        </div>
      </div>

    </div>
  </div>
</section>

{% endblock %}
