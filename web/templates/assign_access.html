{% extends "layout.html" %}
{% block content %}

<div class="container my-5">
  <div class="card shadow-lg p-4 rounded-4">
    <h2 class="text-danger mb-4 text-center">Assign Access to Restricted File</h2>

    <!-- Search Bar -->
    <div class="mb-3">
      <input type="text" id="searchInput" class="form-control shadow-sm" placeholder=" Search by name..." onkeyup="filterUsers()">
    </div>

    <form method="POST">
      <input type="hidden" name="file_id" value="{{ file_id }}">

      <!-- Scrollable User List -->
      <div class="user-list border rounded-3 p-3" style="max-height: 320px; overflow-y: auto;">
        {% for s in students %}
        <div class="form-check d-flex align-items-center py-2 px-2 user-entry border-bottom hover-bg">
          <input class="form-check-input me-2" type="checkbox" name="allowed_users" value="{{ s[0] }}" id="student{{ s[0] }}">
          <label class="form-check-label w-100" for="student{{ s[0] }}">
            {{ s[1] }} {{ s[2] }}
          </label>
        </div>
        {% endfor %}
      </div>

      <!-- Submit Button -->
      <div class="text-end mt-4">
        <button class="btn btn-danger px-4 py-2 rounded-pill shadow-sm" type="submit">
           Save Access
        </button>
      </div>
    </form>
  </div>
</div>

<!-- JavaScript for Search -->
<script>
  function filterUsers() {
    const input = document.getElementById("searchInput").value.toLowerCase();
    const entries = document.querySelectorAll(".user-entry");

    entries.forEach(entry => {
      const name = entry.textContent.toLowerCase();
      entry.style.display = name.includes(input) ? "" : "none";
    });
  }
</script>

<!-- Additional styles -->
<style>
  .hover-bg:hover {
    background-color: #fff2f2;
    transition: 0.2s ease-in-out;
    border-radius: 8px;
  }
  .form-check-input:checked {
    background-color: #dc3545;
    border-color: #dc3545;
  }
</style>

{% endblock %}
