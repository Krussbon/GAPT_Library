{% extends "layout.html" %}
{% block content %}
<div style="text-align: center; margin-top: 100px;">
    <img src="{{ url_for('static', filename='images/lock.png') }}" alt="Access Denied" width="150">
    <h1 style="color: #b30000; font-size: 3rem; margin-top: 20px;">403 - Access Forbidden</h1>
    <p style="font-size: 1.2rem; color: #444; max-width: 600px; margin: 20px auto;">
        🚫 Oops! You're trying to access a section that you're not authorized to view.<br>
        If you think this is a mistake, please contact the <strong>Librarian</strong> for access.
    </p>
    <a href="{{ url_for('index') }}" style="display: inline-block; margin-top: 30px; padding: 10px 25px; background-color: #b30000; color: white; text-decoration: none; border-radius: 10px;">
        🔙 Back to Home
    </a>
</div>
{% endblock %}
