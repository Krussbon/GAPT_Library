{% extends "layout.html" %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-lg rounded-4">
        <div class="card-body p-5 bg-light">

          <h2 class="text-center text-danger fw-bold mb-4"> Upload</h2>

          <form method="POST" enctype="multipart/form-data" id="uploadForm">
            <div class="mb-3">
              <label for="name" class="form-label text-danger">Name</label>
              <input type="text" name="name" id="name" class="form-control" required>
            </div>

            <div class="mb-3">
              <label for="description" class="form-label text-danger">Description</label>
              <input type="text" name="description" id="description" class="form-control" required>
            </div>

            <div class="mb-3">
              <label for="upload_date" class="form-label text-danger">Upload Date</label>
              <input type="date" name="upload_date" id="upload_date" class="form-control" required>
            </div>

            <div class="mb-3">
              <label for="material_type" class="form-label text-danger">Material Type</label>
              <select name="material_type" id="material_type" class="form-select" onchange="updateFormFields()" required>
                <option value="1">Lecture Notes</option>
                <option value="2">Assignment</option>
                <option value="3">Exam/Solution</option>
                <option value="4">Research Paper</option>
                <option value="5">Lab Report</option>
                <option value="6">Thesis/Dissertation</option>
                <option value="7">Video</option>
                <option value="8">Presentation</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="subject_category" class="form-label text-danger">Subject Category</label>
              <select name="subject_category" id="subject_category" class="form-select" required>
                <option value="Humanities">Humanities</option>
                <option value="Theatre">Theatre</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Law">Law</option>
                <option value="Music">Music</option>
                <option value="Physics">Physics</option>
                <option value="Chemistry">Chemistry</option>
                <option value="Biology">Biology</option>
                <option value="Psychology">Psychology</option>
                <option value="Sociology">Sociology</option>
                <option value="Theology">Theology</option>
              </select>
            </div>

            <div id="dynamic-fields" class="mb-4"></div>

            <div class="mb-4">
              <label class="form-label text-danger">Accessibility</label><br>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="accessibility" id="open_access" value="Open Access" checked>
                <label class="form-check-label" for="open_access">Open Access</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="accessibility" id="university_only" value="University Only">
                <label class="form-check-label" for="university_only">University Only</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="accessibility" id="restricted" value="Restricted">
                <label class="form-check-label" for="restricted">Restricted</label>
              </div>
            </div>

            <div class="mb-4">
              <label for="file" class="form-label text-danger">Select File</label>
              <input class="form-control" type="file" name="file" id="file" required>
            </div>

            <button type="submit" class="btn btn-danger w-100 rounded-pill fw-semibold"> Upload</button>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>

<!--  JavaScript function -->
 
<script>
    function updateFormFields() {
      const materialType = document.getElementById('material_type').value;
      const dynamicFields = document.getElementById('dynamic-fields');
      dynamicFields.innerHTML = '';
    
      const fieldTemplate = (label, name, type = 'text') => `
        <div class="mb-3">
          <label for="${name}" class="form-label text-danger">${label}</label>
          <input id="${name}" name="${name}" type="${type}" class="form-control" required>
        </div>
      `;
    
      switch(materialType) {
        case '1': // Lecture Notes
          dynamicFields.innerHTML = 
            fieldTemplate("Course Name", "Course Name") +
            fieldTemplate("Lecturer Name", "Lecturer Name") +
            fieldTemplate("Semester", "Semester", "number") +
            fieldTemplate("Year", "Year", "number") +
            fieldTemplate("Topic", "Topic");
          break;
    
        case '2': // Assignment
          dynamicFields.innerHTML = 
            fieldTemplate("Course Name", "Course Name") +
            fieldTemplate("Assignment Number", "Assignment Number", "number") +
            fieldTemplate("Due Date", "Due Date", "date") +
            fieldTemplate("Instructor Name", "Instructor Name") +
            fieldTemplate("Year", "Year", "number");
          break;
    
        case '3': // Exam/Solution
          dynamicFields.innerHTML = 
            fieldTemplate("Course Name", "Course Name") +
            fieldTemplate("Exam Type", "Exam Type") +
            fieldTemplate("Year", "Year") +
            fieldTemplate("Instructor", "Instructor") +
            fieldTemplate("Duration (hrs)", "Duration", "number");
          break;
    
        case '4': // Research Paper
          dynamicFields.innerHTML = 
            fieldTemplate("Title", "Title") +
            fieldTemplate("Authors", "Authors") +
            fieldTemplate("Publication Year", "Publication Year", "number") +
            fieldTemplate("Journal/Conference Name", "Journal/Conference Name");
          break;
    
        case '5': // Lab Report
          dynamicFields.innerHTML = 
            fieldTemplate("Experiment Title", "Experiment Title") +
            fieldTemplate("Subject", "Subject") +
            fieldTemplate("Instructor", "Instructor") +
            fieldTemplate("Lab Partners", "Lab Partners");
          break;
    
        case '6': // Thesis/Dissertation
          dynamicFields.innerHTML = 
            fieldTemplate("Title", "Title") +
            fieldTemplate("Student Name", "Student Name") +
            fieldTemplate("Supervisor", "Supervisor") +
            fieldTemplate("Department", "Department") +
            fieldTemplate("Year", "Year", "number") +
            fieldTemplate("Abstract", "Abstract") +
            fieldTemplate("Degree Level", "Degree Level");
          break;
    
        case '7': // Video
          dynamicFields.innerHTML = 
            fieldTemplate("Course Name", "Course Name") +
            fieldTemplate("Title", "Title") +
            fieldTemplate("Instructor", "Instructor") +
            fieldTemplate("Duration", "Duration", "number") +
            fieldTemplate("Topic", "Topic");
          break;
    
        case '8': // Presentation
          dynamicFields.innerHTML = 
            fieldTemplate("Title", "Title") +
            fieldTemplate("Speaker Name", "Speaker Name") +
            fieldTemplate("Event/Course Name", "Course Name") +
            fieldTemplate("Date Presented", "Date Presented", "date") +
            fieldTemplate("Topic", "Topic");
          break;
      }
    }
    </script>
    
{% endblock %}
