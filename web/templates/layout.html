<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AcaRep</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='Stylesheets/style.css') }}">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans&display=swap" rel="stylesheet">

  <!-- AOS CSS -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">


  <style>
    body {
      font-family: 'Fira Sans', sans-serif;
      background-color: #f8f9fa;
    }
    footer {
      background-color: #ffffff;
      border-top: 2px solid #c00000;
    }
    footer h6 {
      color: #c00000;
      font-weight: 600;
    }
    footer p, footer a {
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 5px;
    }
    footer a:hover {
      color: #c00000;
      text-decoration: underline;
    }
  </style>
</head>

<body class="d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4 py-2">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center text-danger fw-bold fs-4" href="{{ url_for('index') }}">
        <img src="{{ url_for('static', filename='images/book-7672463_1280.png') }}" width="32" class="me-2"> AcaRep
      </a>
      <div class="ms-auto d-flex align-items-center gap-3">
        {% if session.get('user_id') %}
          <a class="text-danger fw-semibold" href="{{ url_for('repo') }}">Repository</a>
          <a class="text-danger fw-semibold" href="{{ url_for('logout') }}">Logout</a>
        {% else %}
          <a class="text-danger fw-semibold" href="{{ url_for('login') }}">Login</a>
        {% endif %}
      </div>
      
      
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-grow-1">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="mt-auto py-3">

    
    

    <div class="container">
      <div class="row text-center text-md-start">
        <div class="col-md-4 mb-2">
          <h6>Contact</h6>
          <p>Email: umrepository22@edu.mt</p>
          <p>Tel: 8008135</p>
        </div>
        <div class="col-md-4 mb-2">
          <h6>Quick Links</h6>
          <a href="{{ url_for('about') }}">About Us</a><br>
          <a href="{{ url_for('help_page') }}">Help</a><br>
          <a href="{{ url_for('privacy') }}">Privacy Policy</a>
        </div>
        <div class="col-md-4 mb-2">
          <h6>University</h6>
          <p>University of Malta</p>
          <p class="text-muted small mb-0">&copy; AcaRepUoM 2025</p>
        </div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init();
  </script>

</body>
</html>
