<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AcaRep</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='Stylesheets/style.css') }}">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans&display=swap" rel="stylesheet">

  <!-- AOS Animation -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light px-4">
    <a class="navbar-brand d-flex align-items-center text-danger fw-bold" href="{{ url_for('index') }}">
      <img src="{{ url_for('static', filename='images/book-7672463_1280.png') }}" width="30" class="me-2"> AcaRep
    </a>
    <div class="ms-auto">
      {% if not session.get('user_id') %}
        <a class="text-danger me-3" href="{{ url_for('login') }}">Login</a>
      {% endif %}
      <a class="text-danger" href="{{ url_for('repo') }}">Repository</a>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="wrapper">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="text-center py-4 text">
    &copy; AcaRepUoM 2025<br>
    Contact: umrepository22@edu.mt<br>
    Tel: 8008135<br>
    Help • University of Malta • About Us • Privacy Policy
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init();
  </script>
</body>
</html>
